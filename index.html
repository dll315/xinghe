
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香格里拉天河 · 银河观测</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: crosshair; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
  #sky { position: fixed; inset: 0; display: block; }
  #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 13px; letter-spacing: 2px; pointer-events: none; text-align: center; text-shadow: 0 0 8px #000; z-index: 5; }
  #panel { position: fixed; left: 0; top: 0; height: 100%; width: 320px; padding: 46px 30px 30px; background: linear-gradient(115deg, rgba(10,8,30,.62), rgba(8,6,24,.30) 60%, rgba(0,0,0,0)); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); color: #eef; z-index: 6; transform: translateX(-260px); transition: transform .5s cubic-bezier(.22,.61,.36,1); pointer-events: none; }
  #panel.open { transform: translateX(0); }
  #panel h1 { font-size: 30px; font-weight: 200; letter-spacing: 6px; margin-bottom: 6px; text-shadow: 0 0 18px rgba(120,160,255,.5); background: linear-gradient(90deg,#cfe0ff,#a0c8ff,#e8d0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #panel .sub { font-size: 12px; letter-spacing: 8px; color: #8ea8d8; margin-bottom: 22px; }
  #panel p { font-size: 13px; line-height: 2.05; color: rgba(225,232,255,.82); margin-bottom: 16px; text-align: justify; }
  #panel .data { border-top: 1px solid rgba(150,180,255,.18); margin-top: 18px; padding-top: 16px; }
  #panel .row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(200,215,255,.7); padding: 4px 0; }
  #panel .row b { font-weight: 400; color: #dfeaff; }
  #toggle { position: fixed; left: 20px; top: 22px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(180,200,255,.4); background: rgba(15,15,40,.5); color: #cde; font-size: 18px; cursor: pointer; z-index: 7; backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; transition: background .3s; }
  #toggle:hover { background: rgba(60,80,160,.6); }
  #music { position: fixed; right: 20px; top: 22px; display: flex; gap: 10px; z-index: 7; }
  .mbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(180,200,255,.4); background: rgba(15,15,40,.5); color: #cde; font-size: 16px; cursor: pointer; backdrop-filter: blur(6px); transition: all .3s; display: flex; align-items: center; justify-content: center; }
  .mbtn:hover { background: rgba(60,80,160,.6); transform: scale(1.08); }
  .mbtn.playing { background: rgba(80,120,200,.55); border-color: rgba(180,210,255,.7); box-shadow: 0 0 14px rgba(120,160,255,.45); }
  #toast { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); background: rgba(15,15,40,.7); color: #dfeaff; padding: 9px 22px; border-radius: 22px; font-size: 13px; letter-spacing: 2px; border: 1px solid rgba(150,180,255,.3); backdrop-filter: blur(6px); opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 8; }
  #musicBars { position: fixed; right: 26px; top: 74px; width: 30px; height: 26px; display: none; align-items: flex-end; justify-content: space-between; z-index: 7; }
  #musicBars.on { display: flex; }
  #musicBars span { width: 3px; background: linear-gradient(#ffdfae,#9bc8ff); border-radius: 2px; transform-origin: bottom; }
  #loader { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; color: #6f86c9; font-size: 13px; letter-spacing: 6px; z-index: 9; transition: opacity 1s; }
  .spin { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,.15); border-top-color: #9bc8ff; border-radius: 50%; animation: sp 1s linear infinite; margin: 0 14px 0 0; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="loader"><div class="spin"></div>正在凝视苍穹…</div>

<button id="toggle" title="信息">☰</button>
<div id="panel">
  <h1>天河</h1>
  <div class="sub">香格里拉 · 银河</div>
  <p>海拔三千三百米的香格里拉，空气稀薄而澄澈。当夜幕沉沉落下，银河如一条发亮的河流，自东南方缓缓升起，横贯天穹，流向西南。</p>
  <p>天鹰、天鹅、仙后座依次隐现于光河之中，暗带如墨色的峡谷将天河一分为二。那正是我们望向银河系旋臂深处时，所穿越的尘埃与气体。</p>
  <p>在这里，肉眼可见的星辰逾两千颗，银河中心的人马座方向尤为璀璨。让光，继续流淌。</p>
  <div class="data">
    <div class="row"><span>观测地</span><b>云南 · 香格里拉</b></div>
    <div class="row"><span>海拔</span><b>3,300 m</b></div>
    <div class="row"><span>视宁度</span><b>极佳</b></div>
    <div class="row"><span>主要天体</span><b>人马座银河中心</b></div>
    <div class="row"><span>坐标</span><b>27°50′N 99°42′E</b></div>
  </div>
</div>

<div id="music">
  <button class="mbtn" id="playBtn" title="播放音乐">♪</button>
</div>
<div id="musicBars"><span></span><span></span><span></span><span></span></div>

<div id="toast"></div>
<div id="hint">移动鼠标 · 滚轮缩放 · 点击许愿流星 · ☰ 详情</div>

<script>
"use strict";
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

// ---------- 缩放与视差 ----------
let zoom = 1, targetZoom = 1;
const parallax = { x: 0, y: 0, tx: 0, ty: 0 };

// ---------- 银河几何（屏幕坐标） ----------
let MW = null;
function buildGalaxy() {
  MW = {
    // 银河带从屏幕左下到右上的一组控制点（带状中线）
    nodes: [
      { x: -0.08, y: 1.08 },
      { x:  0.18, y: 0.74 },
      { x:  0.42, y: 0.46 },
      { x:  0.58, y: 0.30 },
      { x:  0.78, y: 0.16 },
      { x:  1.06, y: -0.10 }
    ],
    center: { x: 0.74, y: 0.40 } // 银河中心（人马座方向，亮核）
  };
}

function nodePt(i) {
  const n = MW.nodes[i];
  return { x: n.x * W, y: n.y * H };
}
function bandDir() {
  const a = nodePt(0), b = nodePt(MW.nodes.length - 1);
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  return { x: dx / L, y: dy / L };
}
function bandNormal() {
  const d = bandDir();
  return { x: -d.y, y: d.x };  // 垂直于银河方向
}
// 沿银河中线参数 t∈[0,1] 取点
function bandPoint(t) {
  const segs = MW.nodes.length - 1;
  const ft = t * segs;
  const i = Math.min(Math.floor(ft), segs - 1);
  const f = ft - i;
  const a = nodePt(i), b = nodePt(i + 1);
  // 平滑曲线：用相邻三点做简单权重
  return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
}

// ---------- 星星 ----------
let stars = [], bandStars = [], nebulae = [];
function genStars() {
  stars = []; bandStars = []; nebulae = [];
  const area = W * H;
  const bgCount = Math.floor(area / 1900);
  const normal = bandNormal();

  // 背景散星
  for (let i = 0; i < bgCount; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.pow(Math.random(), 2.6) * 1.3 + 0.15,
      t: Math.random() * Math.PI * 2,
      ts: 0.4 + Math.random() * 2.2,
      c: starColor(),
      a: 0.3 + Math.random() * 0.7
    });
  }

  // 银河带密集星
  const bandCount = Math.floor(area / 230);
  for (let i = 0; i < bandCount; i++) {
    const t = Math.random();
    const p = bandPoint(t);
    // 距中线的高斯偏移（带宽）
    const off = gauss() * (0.11 * Math.min(W, H));
    p.x += normal.x * off; p.y += normal.y * off;
    bandStars.push({
      x: p.x / W, y: p.y / H,
      r: Math.pow(Math.random(), 2.2) * 1.6 + 0.12,
      t: Math.random() * Math.PI * 2,
      ts: 0.6 + Math.random() * 3,
      c: bandStarColor(t),
      a: 0.35 + Math.random() * 0.65,
      // 离银河中心越近越亮
      bright: 1 - Math.abs(t - 0.74) * 1.1
    });
  }

  // 星云团
  const nebColors = [
    ["255,120,170", "120,70,200"],   // 粉紫
    ["120,200,255", "60,90,220"],    // 蓝青
    ["255,200,120", "200,80,60"],    // 橙金（银河中心）
    ["160,120,255", "80,40,160"]     // 紫罗兰
  ];
  const nebCount = 7;
  for (let i = 0; i < nebCount; i++) {
    const t = i / (nebCount - 1);
    const p = bandPoint(t);
    const off = gauss() * 0.05 * Math.min(W, H);
    const cx = (p.x + normal.x * off) / W;
    const cy = (p.y + normal.y * off) / H;
    const nearCenter = 1 - Math.abs(t - 0.74);
    nebulae.push({
      cx, cy,
      r: (0.06 + Math.random() * 0.10) * Math.min(W, H) * (1 + nearCenter),
      col: nebColors[i % nebColors.length],
      drift: Math.random() * Math.PI * 2,
      ds: 0.3 + Math.random() * 0.6
    });
  }
}

function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function starColor() {
  const k = Math.random();
  if (k < 0.55) return [220, 230, 255];
  if (k < 0.78) return [255, 248, 230];
  if (k < 0.90) return [180, 200, 255];
  if (k < 0.97) return [255, 210, 170];
  return [255, 170, 150];
}
function bandStarColor(t) {
  // 中心区偏暖金，两端偏蓝白
  const warm = Math.max(0, 1 - Math.abs(t - 0.74) * 2.2);
  const k = Math.random();
  if (k < 0.3 + warm * 0.3) return [255, 235, 200];
  if (k < 0.6) return [230, 240, 255];
  if (k < 0.85) return [255, 210, 180];
  return [200, 220, 255];
}

// ---------- 流星 ----------
const meteors = [];
function spawnMeteor(fromClick, sx, sy) {
  const ang = Math.PI * (0.15 + Math.random() * 0.25); // 向右下
  const sp = 9 + Math.random() * 8;
  let x, y;
  if (fromClick) { x = sx; y = sy; }
  else {
    const side = Math.random();
    if (side < 0.5) { x = Math.random() * W * 0.6; y = -20; }
    else { x = -20; y = Math.random() * H * 0.5; }
  }
  meteors.push({
    x, y,
    vx: Math.cos(ang) * sp,
    vy: Math.sin(ang) * sp,
    life: 0, maxLife: 50 + Math.random() * 40,
    len: 90 + Math.random() * 120,
    w: 1.2 + Math.random() * 1.6,
    hue: fromClick ? [255, 230, 180] : [220, 240, 255]
  });
}

// ---------- 雪山（香格里拉剪影） ----------
let mountains = [];
function genMountains() {
  mountains = [];
  // 远 / 中 / 近三层，由远到近颜色由深蓝到近黑
  const layers = [
    { baseY: 0.80, amp: 0.05, peak: 7, col: [16, 24, 56], snow: 0.5 },
    { baseY: 0.88, amp: 0.08, peak: 9, col: [8, 14, 38], snow: 0.62 },
    { baseY: 0.94, amp: 0.07, peak: 11, col: [3, 6, 20], snow: 0.74 }
  ];
  layers.forEach((L, li) => {
    const pts = [];
    const seg = 38;
    for (let i = 0; i <= seg; i++) {
      const x = i / seg;
      let y = L.baseY;
      // 多频率叠加做出参差山脊
      y -= Math.sin(i * 0.7 + li * 2.1) * 0.45 * L.amp;
      y -= Math.sin(i * 1.9 + li * 4.7) * 0.30 * L.amp;
      y -= Math.sin(i * 3.3 + li * 1.3) * 0.18 * L.amp;
      y -= (Math.sin(i * 6.1 + li * 3.0) * 0.5 + 0.5) * 0.22 * L.amp; // 产生尖峰
      pts.push({ x, y });
    }
    mountains.push({ pts, col: L.col, snow: L.snow, layer: li });
  });
}

// ---------- 尺寸 ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildGalaxy();
  genStars();
  genMountains();
}

// ---------- 主渲染 ----------
let time = 0;
function render(dt) {
  time += dt;
  // 平滑视差与缩放
  parallax.x += (parallax.tx - parallax.x) * 0.08;
  parallax.y += (parallax.ty - parallax.y) * 0.08;
  zoom += (targetZoom - zoom) * 0.08;

  // 背景渐变（天空）
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#05060f");
  g.addColorStop(0.35, "#070a1c");
  g.addColorStop(0.7, "#0a0b22");
  g.addColorStop(1, "#0c0418");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  // 视差：整体轻微平移；缩放以银河中心为锚
  const cx = MW.center.x * W, cy = MW.center.y * H;
  ctx.translate(cx + parallax.x, cy + parallax.y);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);

  // 1) 星云 / 银河辉光
  drawNebulae();
  // 2) 银河带主体（尘埃带 + 亮带）
  drawMilkyWay();
  // 3) 银河中心亮核
  drawCore();
  // 4) 星星
  drawStars();
  // 5) 流星
  drawMeteors(dt);
  ctx.restore();

  // 6) 雪山剪影（不参与内容缩放，仅微弱视差）
  drawMountains();

  // 7) 底部地面雾气
  drawGroundFog();

  // 8) 暗角
  drawVignette();
}

function drawNebulae() {
  ctx.globalCompositeOperation = "lighter";
  nebulae.forEach(n => {
    const drift = Math.sin(time * 0.0002 * n.ds + n.drift) * 6;
    const x = n.cx * W + drift, y = n.cy * H + drift * 0.5;
    let r = n.r;
    if (!(r > 0) || !isFinite(x) || !isFinite(y)) r = Math.max(1, 0.08 * Math.min(W, H));
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${n.col[0]},0.22)`);
    grad.addColorStop(0.35, `rgba(${n.col[1]},0.12)`);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over";
}

function drawMilkyWay() {
  const n = MW.nodes.length;
  const normal = bandNormal();

  // 多层带状辉光，越靠近中心越宽越亮
  ctx.globalCompositeOperation = "lighter";

  // 外层柔光带
  for (let layer = 0; layer < 3; layer++) {
    const width = (0.16 + layer * 0.05) * Math.min(W, H);
    const alpha = 0.05 - layer * 0.012;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const p = nodePt(i);
      if (i === 0) ctx.moveTo(p.x + normal.x * width, p.y + normal.y * width);
      else ctx.lineTo(p.x + normal.x * width, p.y + normal.y * width);
    }
    for (let i = n - 1; i >= 0; i--) {
      const p = nodePt(i);
      ctx.lineTo(p.x - normal.x * width, p.y - normal.y * width);
    }
    ctx.closePath();
    const cpx = MW.center.x * W, cpy = MW.center.y * H;
    const lg = ctx.createLinearGradient(0, cpy - width, 0, cpy + width);
    lg.addColorStop(0, "rgba(120,140,220,0)");
    lg.addColorStop(0.5, `rgba(190,200,240,${alpha})`);
    lg.addColorStop(1, "rgba(120,90,200,0)");
    ctx.fillStyle = lg; ctx.fill();
  }

  // 主体亮带（沿中线）
  const halfW = 0.085 * Math.min(W, H);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p = nodePt(i);
    if (i === 0) ctx.moveTo(p.x + normal.x * halfW, p.y + normal.y * halfW);
    else ctx.lineTo(p.x + normal.x * halfW, p.y + normal.y * halfW);
  }
  for (let i = n - 1; i >= 0; i--) {
    const p = nodePt(i);
    ctx.lineTo(p.x - normal.x * halfW, p.y - normal.y * halfW);
  }
  ctx.closePath();
  const bg = ctx.createLinearGradient(nodePt(0).x, nodePt(0).y, nodePt(n - 1).x, nodePt(n - 1).y);
  bg.addColorStop(0.0, "rgba(80,70,160,0.16)");
  bg.addColorStop(0.35, "rgba(150,140,210,0.20)");
  bg.addColorStop(0.65, "rgba(230,205,170,0.26)");  // 中心暖光
  bg.addColorStop(0.78, "rgba(255,220,170,0.22)");
  bg.addColorStop(1.0, "rgba(90,110,200,0.14)");
  ctx.fillStyle = bg; ctx.fill();

  // 暗带（尘埃带）：中线偏移出现一条暗色裂隙
  ctx.globalCompositeOperation = "destination-out";
  const darkOff = -0.018 * Math.min(W, H);
  const darkW = 0.022 * Math.min(W, H);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p = nodePt(i);
    if (i === 0) ctx.moveTo(p.x + normal.x * (darkOff + darkW), p.y + normal.y * (darkOff + darkW));
    else ctx.lineTo(p.x + normal.x * (darkOff + darkW), p.y + normal.y * (darkOff + darkW));
  }
  for (let i = n - 1; i >= 0; i--) {
    const p = nodePt(i);
    ctx.lineTo(p.x + normal.x * (darkOff - darkW), p.y + normal.y * (darkOff - darkW));
  }
  ctx.closePath();
  const dg = ctx.createLinearGradient(0, 0, normal.x * 1000, normal.y * 1000);
  dg.addColorStop(0, "rgba(0,0,0,0.05)");
  dg.addColorStop(0.5, "rgba(0,0,0,0.55)");
  dg.addColorStop(1, "rgba(0,0,0,0.05)");
  ctx.fillStyle = dg; ctx.fill();

  ctx.globalCompositeOperation = "source-over";
}

function drawCore() {
  ctx.globalCompositeOperation = "lighter";
  const cx = MW.center.x * W, cy = MW.center.y * H;
  const pulse = 1 + Math.sin(time * 0.0008) * 0.05;
  // 大辉光
  const rCore1 = Math.max(2, 0.22 * Math.min(W, H) * pulse);
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, rCore1);
  g1.addColorStop(0, "rgba(255,235,200,0.32)");
  g1.addColorStop(0.3, "rgba(255,190,140,0.16)");
  g1.addColorStop(0.7, "rgba(180,90,160,0.06)");
  g1.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(cx, cy, 0.22 * Math.min(W, H) * pulse, 0, Math.PI * 2); ctx.fill();
  // 内核
  const rCore2 = Math.max(2, 30 * pulse);
  const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, rCore2);
  g2.addColorStop(0, "rgba(255,250,230,0.9)");
  g2.addColorStop(0.4, "rgba(255,220,170,0.4)");
  g2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(cx, cy, 30 * pulse, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

function drawStars() {
  // 背景星
  ctx.globalCompositeOperation = "lighter";
  stars.forEach(s => {
    const tw = 0.6 + 0.4 * Math.sin(time * 0.001 * s.ts + s.t);
    const a = s.a * tw;
    const x = s.x * W, y = s.y * H;
    ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.r > 0.9) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(1, s.r * 6));
      g.addColorStop(0, `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a * 0.4})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s.r * 6, 0, Math.PI * 2); ctx.fill();
    }
  });
  // 银河带星，越靠中心越密越亮
  bandStars.forEach(s => {
    const tw = 0.6 + 0.4 * Math.sin(time * 0.001 * s.ts + s.t);
    const a = s.a * tw * (0.6 + s.bright * 0.4);
    const x = s.x * W, y = s.y * H;
    ctx.fillStyle = `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a})`;
    ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over";
}

function drawMeteors(dt) {
  ctx.globalCompositeOperation = "lighter";
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy; m.life++;
    const k = m.life / m.maxLife;
    const alpha = k < 0.15 ? k / 0.15 : (1 - k);
    const tx = m.x - m.vx * (m.len / 10);
    const ty = m.y - m.vy * (m.len / 10);
    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0, `rgba(${m.hue[0]},${m.hue[1]},${m.hue[2]},${alpha})`);
    grad.addColorStop(0.4, `rgba(${m.hue[0]},${m.hue[1]},${m.hue[2]},${alpha * 0.5})`);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.strokeStyle = grad; ctx.lineWidth = m.w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    // 头部光点
    ctx.fillStyle = `rgba(255,250,235,${alpha})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.w * 1.4, 0, Math.PI * 2); ctx.fill();
    if (m.life >= m.maxLife || m.x > W + 50 || m.y > H + 50) meteors.splice(i, 1);
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawMountains() {
  const px = parallax.x * 0.3;
  mountains.forEach((M, idx) => {
    const offx = px * (0.4 + idx * 0.3);
    ctx.fillStyle = `rgb(${M.col[0]},${M.col[1]},${M.col[2]})`;
    ctx.beginPath();
    ctx.moveTo(-2 - offx, H + 2);
    M.pts.forEach(p => ctx.lineTo(p.x * W + offx, p.y * H));
    ctx.lineTo(W + 2 - offx, H + 2);
    ctx.closePath();
    ctx.fill();

    // 山脊雪线高光
    ctx.strokeStyle = `rgba(200,215,255,${M.snow})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    M.pts.forEach((p, i) => {
      const x = p.x * W + offx, y = p.y * H;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 山顶星光照亮点
    if (idx === mountains.length - 1) {
      M.pts.forEach(p => {
        if (p.y < 0.86) {
          const x = p.x * W + offx, y = p.y * H;
          const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
          g.addColorStop(0, "rgba(220,230,255,0.5)");
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
        }
      });
    }
  });
}

function drawGroundFog() {
  const g = ctx.createLinearGradient(0, H * 0.82, 0, H);
  g.addColorStop(0, "rgba(20,18,45,0)");
  g.addColorStop(0.6, "rgba(30,22,55,0.35)");
  g.addColorStop(1, "rgba(8,6,20,0.85)");
  ctx.fillStyle = g; ctx.fillRect(0, H * 0.82, W, H * 0.18);
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- 主循环 ----------
let last = performance.now();
let meteorTimer = 0;
function loop(now) {
  const dt = Math.min(now - last, 50);
  last = now;
  meteorTimer += dt;
  if (meteorTimer > 4200 + Math.random() * 5000) {
    meteorTimer = 0;
    spawnMeteor(false);
  }
  render(dt);
  requestAnimationFrame(loop);
}

// ---------- 交互 ----------
window.addEventListener("resize", resize);
window.addEventListener("mousemove", e => {
  parallax.tx = (e.clientX / W - 0.5) * 40;
  parallax.ty = (e.clientY / H - 0.5) * 24;
});
window.addEventListener("wheel", e => {
  targetZoom *= e.deltaY > 0 ? 0.92 : 1.08;
  targetZoom = Math.max(0.7, Math.min(2.4, targetZoom));
}, { passive: true });
window.addEventListener("click", e => {
  if (e.target.closest("button")) return;
  spawnMeteor(true, e.clientX, e.clientY);
});
// 触摸
window.addEventListener("touchmove", e => {
  const t = e.touches[0]; if (!t) return;
  parallax.tx = (t.clientX / W - 0.5) * 40;
  parallax.ty = (t.clientY / H - 0.5) * 24;
}, { passive: true });
window.addEventListener("touchstart", e => {
  const t = e.touches[0]; if (!t) return;
  if (!e.target.closest("button")) spawnMeteor(true, t.clientX, t.clientY);
}, { passive: true });

// ---------- 信息面板 ----------
const panel = document.getElementById("panel");
const toggle = document.getElementById("toggle");
toggle.addEventListener("click", () => {
  panel.classList.toggle("open");
  toggle.textContent = panel.classList.contains("open") ? "✕" : "☰";
});

// ---------- Toast ----------
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.opacity = 0, 1600);
}

// ---------- 音乐（Web Audio API 程序生成） ----------
let audioCtx = null, master = null, musicOn = false, musicNodes = [];
const playBtn = document.getElementById("playBtn");
const musicBars = document.getElementById("musicBars");

function startMusic() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = 0;
    master.connect(audioCtx.destination);

    // 主混响（简易卷积 IR）—— 用衰减噪声做脉冲响应
    const irLen = audioCtx.sampleRate * 3;
    const ir = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < irLen; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3.0);
      }
    }
    const conv = audioCtx.createConvolver();
    conv.buffer = ir;
    const wet = audioCtx.createGain(); wet.gain.value = 0.5;
    const dry = audioCtx.createGain(); dry.gain.value = 0.6;
    master.connect(dry); dry.connect(audioCtx.destination);
    master.connect(conv); conv.connect(wet); wet.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  // 渐入
  master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.setValueAtTime(master.gain.value, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.32, audioCtx.currentTime + 2.5);

  musicOn = true;
  playBtn.classList.add("playing");
  musicBars.classList.add("on");
  animateBars();
  schedulePad();
  scheduleChimes();
  toast("夜空之音 · 已开始");
}

function stopMusic() {
  if (!audioCtx) return;
  master.gain.cancelScheduledValues(audioCtx.currentTime);
  master.gain.setValueAtTime(master.gain.value, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
  musicOn = false;
  playBtn.classList.remove("playing");
  musicBars.classList.remove("on");
  musicNodes.forEach(n => { try { n.stop(); } catch (e) {} });
  musicNodes = [];
  toast("夜空之音 · 已停止");
}

playBtn.addEventListener("click", () => {
  if (musicOn) stopMusic(); else startMusic();
});

// 持续的低频 pad（D 小调氛围）：D2 / A2 / F3 / A3
function schedulePad() {
  if (!musicOn) return;
  const freqs = [73.42, 110.00, 174.61, 220.00];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = i === 0 ? "sine" : (i === 1 ? "triangle" : "sine");
    osc.frequency.value = f;
    // 轻微失谐
    const osc2 = audioCtx.createOscillator();
    osc2.type = "sine"; osc2.frequency.value = f * 1.003;
    const g = audioCtx.createGain();
    g.gain.value = 0;
    g.gain.setTargetAtTime(0.06 + i * 0.012, audioCtx.currentTime, 3);
    // 缓慢颤音
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.05 + i * 0.03;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.012;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    osc.connect(g); osc2.connect(g);
    g.connect(master);
    osc.start(); osc2.start(); lfo.start();
    musicNodes.push(osc, osc2, lfo);
    // 8~14 秒后淡出重生
    const dur = 8000 + i * 1500;
    setTimeout(() => {
      g.gain.setTargetAtTime(0, audioCtx.currentTime, 2.5);
      setTimeout(() => { try { osc.stop(); osc2.stop(); lfo.stop(); } catch (e) {} }, 3500);
    }, dur);
  });
  if (musicOn) setTimeout(schedulePad, 9000);
}

// 间歇性清亮钟声 / 星音（五声音阶随机）
const pentatonic = [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46, 783.99];
function chime() {
  if (!musicOn) return;
  const f = pentatonic[Math.floor(Math.random() * pentatonic.length)];
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = "sine"; osc.frequency.value = f;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.12, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
  // 加一个高八度泛音
  const o2 = audioCtx.createOscillator();
  o2.type = "sine"; o2.frequency.value = f * 2;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(0.05, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
  osc.connect(g); g.connect(master);
  o2.connect(g2); g2.connect(master);
  osc.start(t); o2.start(t);
  osc.stop(t + 3.6); o2.stop(t + 2.3);
  musicNodes.push(osc, o2);
  // 视觉：钟声同时触发一颗流星，呼应“星陨有声”
  spawnMeteor(false);
}
function scheduleChimes() {
  if (!musicOn) return;
  chime();
  if (musicOn) setTimeout(scheduleChimes, 3200 + Math.random() * 4500);
}

// 音频可视化条
function animateBars() {
  if (!musicOn) return;
  const bars = musicBars.querySelectorAll("span");
  bars.forEach(b => {
    const h = 6 + Math.random() * 20;
    b.style.height = h + "px";
    b.style.transition = "height .18s ease";
  });
  requestAnimationFrame(animateBars);
}

// ---------- 启动 ----------
resize();
requestAnimationFrame(loop);

// 隐藏 loader
setTimeout(() => {
  const l = document.getElementById("loader");
  l.style.opacity = 0;
  setTimeout(() => l.style.display = "none", 1000);
}, 500);

// 首屏来几颗流星营造氛围
setTimeout(() => spawnMeteor(false), 1200);
setTimeout(() => spawnMeteor(false), 2600);
</script>
